; PlatformIO Project Configuration File
; ESP32-C5 N16R8 (16MB flash + 8MB QUAD PSRAM, xac nhan qua anh board that)
; ST7789 2.4" TFT + XPT2046 Touch + 5-way resistor ladder + CC1101 + GT24

[env:esp32-c5-tft]
board = esp32-c5-devkitc-1

; SUA: board that la N16R8 (16MB), khong phai 8MB nhu board json mac dinh ghi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; C5 chi co 2 variant: qio_qspi va dio_qspi (PSRAM QUAD da bat san trong
; sdkconfig.h). KHONG co qio_opi/opi_opi cho C5 -> dung qio_qspi.
board_build.arduino.memory_type = qio_qspi

build_src_filter =${env.build_src_filter} +<../boards/ESP32-C5-tft>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5-tft
	-DDEVICE_NAME='"ESP32-C5"'
	-DESP32C5_DEVKITC_1_TFT=1

	; PSRAM: core C5 da bat san (quad 80MHz) trong sdkconfig.h.
	; Chi can BOARD_HAS_PSRAM=1; bo -DCONFIG_SPIRAM_* (OCT/OPI la cua S3).
	-DBOARD_HAS_PSRAM=1

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1

	; TFT driver -- ep ST7789 (SUA tu ILI9341 cua upstream)
	-DST7789_DRIVER=1

	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; XOA: -DFP/-DFM/-DFG la flag toan cuc, dung ten "FP" trung voi
	; kieu du lieu that trong FastLED (using FP = fl::fixed_point<16,16>)
	; -> bien thanh "using 1 = ..." -> loi cu phap. precompiler_flags.h
	; da co default FP=1/FM=2/FG=3 qua #ifndef, khong can khai lai.
	-DBTN_ALIAS='"OK"'

	;FM Radio
	-DFM_SI4713=1
